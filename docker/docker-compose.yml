services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: wayne_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: always
  server:
    image: wayne_server:latest
    container_name: wayne_server
    ports:
      - "18080:80"
    volumes:
      - ${REPOSITORIES_DIR}:/repositories
    restart: always
