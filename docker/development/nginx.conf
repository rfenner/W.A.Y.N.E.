events {
    use epoll;
}

http {

    server {
        listen 80;

        location / {
            proxy_pass http://wayne_frontend:5173;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }

        location /api {
            proxy_pass http://wayne_backend_dev:80;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }
        location /ws {
            proxy_pass http://wayne_backend_dev:80;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }

    }
}
